name: Render slides.tex and README.md

on:
  push:
    branches: [main]
    paths:
      - slides.qmd
      - README.qmd
      - preamble.tex
      - macros.tex
      - gfm-math.lua
      - .github/workflows/render.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: false

      # output-ext:tex stops after Pandoc: no PDF, and no LaTeX needed.
      - run: quarto render slides.qmd --to beamer -M output-ext:tex

      # Pandoc expands the macros from macros.tex, since GitHub can't.
      - run: quarto render README.qmd

      - name: Commit the rendered files if they changed
        run: |
          git add slides.tex README.md
          if git diff --cached --quiet; then
            echo "slides.tex and README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render slides.tex and README.md"
          git push
